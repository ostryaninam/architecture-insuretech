apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  labels:
    app: test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      containers:
        - name: test-app-container
          image: shestera/scaletestapp:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "10Mi"
            limits:
              memory: "10Mi"
